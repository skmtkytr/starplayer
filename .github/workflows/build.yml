name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPV_VERSION: "0.41.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test

      - name: Create dummy mpv sidecar for build
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/mpv-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/mpv-x86_64-unknown-linux-gnu

      - run: npm run build
      - run: cd src-tauri && cargo test
      - run: cd src-tauri && cargo clippy -- -D warnings

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Download mpv (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -L "https://github.com/mpv-player/mpv/releases/download/v${MPV_VERSION}/mpv-v${MPV_VERSION}-macos-15-arm.zip" -o /tmp/mpv.zip
          cd /tmp && unzip -o mpv.zip -d mpv-extract
          cp /tmp/mpv-extract/mpv.app/Contents/MacOS/mpv $GITHUB_WORKSPACE/src-tauri/binaries/mpv-aarch64-apple-darwin
          chmod +x $GITHUB_WORKSPACE/src-tauri/binaries/mpv-aarch64-apple-darwin

      - name: Download mpv (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries
          Invoke-WebRequest -Uri "https://github.com/mpv-player/mpv/releases/download/v$env:MPV_VERSION/mpv-v$env:MPV_VERSION-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\mpv.zip"
          Expand-Archive -Path "$env:TEMP\mpv.zip" -DestinationPath "$env:TEMP\mpv-extract" -Force
          Copy-Item "$env:TEMP\mpv-extract\mpv.exe" -Destination "src-tauri\binaries\mpv-x86_64-pc-windows-msvc.exe"

      - name: Download mpv (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p src-tauri/binaries
          sudo apt-get install -y mpv
          cp $(which mpv) src-tauri/binaries/mpv-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/mpv-x86_64-unknown-linux-gnu

      - run: npm install
      - run: npx tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starplayer-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
